<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><title>Cache Flow – Price Comparison</title>
  <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<header>
  <h1><a href="/">Cache Flow</a></h1>
  <span class="tag">Compare Store A vs Store B – live prices, best deals, 6-month trends</span>
  <form method="post" action="/sync" id="syncForm"><button type="submit">⟳ Sync / Refresh Prices Now</button></form>
</header>
<main>
  <div class="toolbar">
    <input id="search" placeholder="Search products…">
    <select id="category">
      <option value="">All categories</option>
      <option th:each="c : ${categories}" th:value="${c}" th:text="${c}"></option>
    </select>
    <span class="muted">Last synced: <span id="lastSync" th:text="${lastSync != null ? #temporals.format(lastSync,'dd MMM yyyy HH:mm:ss') : 'never'}"></span></span>
  </div>
  <table>
    <thead><tr><th>Product</th><th>Category</th><th class="num">Store A</th><th class="num">Store B</th>
      <th class="num">Difference</th><th>Best Option to Buy</th></tr></thead>
    <tbody id="rows">
    <tr th:each="r : ${rows}" th:attr="data-sku=${r.sku},data-category=${r.category}">
      <td><a th:href="@{/product/{s}(s=${r.sku})}" th:text="${r.name}"></a></td>
      <td th:text="${r.category}"></td>
      <td class="num" th:classappend="${r.best == 'Store A'} ? 'cheapest'" th:text="${r.storeA != null ? '₹' + #numbers.formatDecimal(r.storeA,1,'COMMA',0,'POINT') : '—'}"></td>
      <td class="num" th:classappend="${r.best == 'Store B'} ? 'cheapest'" th:text="${r.storeB != null ? '₹' + #numbers.formatDecimal(r.storeB,1,'COMMA',0,'POINT') : '—'}"></td>
      <td class="num" th:text="${r.difference != null ? '₹' + #numbers.formatDecimal(r.difference,1,'COMMA',0,'POINT') + ' (' + r.differencePct + '%)' : '—'}"></td>
      <td><span class="badge" th:classappend="${r.best == 'Same Price'} ? 'tie'" th:text="${r.best}"></span></td>
    </tr>
    </tbody>
  </table>
</main>
<script src="/app.js"></script>
</body>
</html>
